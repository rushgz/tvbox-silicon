name: iOS IPA

# Two jobs so a failure in packaging never throws away the runtime build. The runtime (OpenJDK
# Zero, libffi, Unicorn, capstone, keystone) takes several hours and is cached separately from
# the small Java host. A new run reuses the native runtime and FFmpeg, then refreshes host.jar
# from the checked-out source so upstream Java fixes are included.
#
# Signing needs three repository secrets, all base64 encoded:
#   IOS_CERTIFICATE        a distribution .p12
#   IOS_CERTIFICATE_PASSWORD
#   IOS_PROVISIONING_PROFILE  the matching .mobileprovision
# Without them the workflow packs an unsigned IPA, which TrollStore installs as it is.

on:
  workflow_dispatch:
    inputs:
      # A zip of the packaged runtime, laid out like build/AppleRuntime/iphoneos. When given, the
      # runtime job imports it instead of rebuilding the native JVM. Usually leave this empty:
      # the branch's packaged runtime cache is restored automatically. host.jar is always refreshed.
      runtime_url:
        description: 'Optional runtime zip to import; leave empty to reuse the branch cache'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Sources/**'
      - 'Packages/**'
      - 'Runtime/**'
      - 'Scripts/**'
      - 'project.yml'
      - 'Package.swift'
      - 'Vendor/**'
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Release publisher
        run: python3 -m unittest discover -s Tests -p test_ios_release.py

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # Two caches. The packaged runtime's key never changes, so a runtime built once is reused
      # even after the scripts change. The build tree's key follows the scripts, because it holds
      # half-finished compiles that the scripts resume.
      - name: Restore the packaged runtime
        id: packaged
        uses: actions/cache@v4
        with:
          path: build/AppleRuntime/iphoneos
          key: apple-runtime-iphoneos-packaged-v1

      # Restore earlier recipes (including the existing v1 cache). The script checks its own
      # recipe signature; a changed recipe gets a new immutable cache key and is saved once.
      - name: Restore the FFmpeg build
        uses: actions/cache@v4
        with:
          path: ffmpeg-cache
          key: apple-ffmpeg-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/build-apple-ffmpeg.sh') }}
          restore-keys: |
            apple-ffmpeg-v2-${{ runner.os }}-${{ runner.arch }}-
            apple-ffmpeg-v1

      - name: Restore the runtime build tree
        uses: actions/cache@v4
        with:
          path: |
            build/apple-runtime
            build/JavaHost
          key: apple-runtime-ios-build-v1-${{ hashFiles('Scripts/**', 'Runtime/**', 'Package.swift') }}

      # The xcode-27 image has cmake, maven and ninja, but not autoconf, which OpenJDK needs to
      # generate its configure script. libffi, capstone and keystone ship their own build files.
      - name: Install build tools
        if: steps.packaged.outputs.cache-hit != 'true' && inputs.runtime_url == ''
        run: brew install autoconf

      # An artifact page needs a login: a plain curl gets a 404. The API serves it with the
      # workflow's own token. A release URL or any other public zip downloads directly.
      - name: Unpack a packaged runtime
        if: inputs.runtime_url != ''
        env:
          RUNTIME_URL: ${{ inputs.runtime_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNTIME_URL" in
            */actions/runs/*/artifacts/*)
              id="${RUNTIME_URL##*/artifacts/}"; id="${id%%/*}"
              repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
              gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" > "$RUNNER_TEMP/runtime.zip" ;;
            *) curl -fL --retry 3 -o "$RUNNER_TEMP/runtime.zip" "$RUNTIME_URL" ;;
          esac
          rm -rf build/AppleRuntime/iphoneos
          mkdir -p build/AppleRuntime/iphoneos
          unzip -q "$RUNNER_TEMP/runtime.zip" -d build/AppleRuntime/iphoneos
          test -f build/AppleRuntime/iphoneos/lib/libTVAppleRuntime.a

      - name: Build FFmpeg
        # Vendor/FFmpeg/FFmpeg.xcframework is a symlink to this script's output, and the package
        # refuses to resolve without the binary inside it. The script skips a cached build.
        run: TVBOX_FFMPEG_CACHE="$PWD/ffmpeg-cache" Scripts/build-apple-ffmpeg.sh

      - name: Restore Java host dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: java-host-maven-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Runtime/JavaHost/pom.xml') }}
          restore-keys: java-host-maven-v1-${{ runner.os }}-${{ runner.arch }}-

      # Java sources change independently of the native JVM. Maven is already on xcode-27.
      - name: Build the current Java host
        env:
          MAVEN_OPTS: -Dmaven.wagon.http.retryHandler.count=3
        run: |
          export JAVA_HOME="$JAVA_HOME_21_arm64"
          Scripts/build-java-host.sh

      - name: Build the on-device runtime
        if: steps.packaged.outputs.cache-hit != 'true' && inputs.runtime_url == ''
        # JAVA_HOME_21_arm64 is set by the runner image. The env context can't be read from a
        # job-level env block, and the build scripts need a JDK of 17 or newer.
        run: |
          export JAVA_HOME="$JAVA_HOME_21_arm64"
          Scripts/package-apple-runtime.sh ios

      - name: Refresh the Java host in the packaged runtime
        run: Scripts/sync-apple-javahost.sh iphoneos

      # Pass this run's refreshed host to the IPA job even when the native runtime came from
      # a cache or runtime_url. This also avoids depending on a second cache restore succeeding.
      - name: Upload the packaged runtime
        uses: actions/upload-artifact@v4
        with:
          name: AppleRuntime-iphoneos
          path: build/AppleRuntime/iphoneos
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  ipa:
    needs: runtime
    permissions:
      contents: write
      actions: read
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Restore the FFmpeg build
        uses: actions/cache@v4
        with:
          path: ffmpeg-cache
          key: apple-ffmpeg-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/build-apple-ffmpeg.sh') }}
          restore-keys: |
            apple-ffmpeg-v2-${{ runner.os }}-${{ runner.arch }}-
            apple-ffmpeg-v1

      - name: Download this run's packaged runtime
        uses: actions/download-artifact@v4
        with:
          name: AppleRuntime-iphoneos
          path: build/AppleRuntime/iphoneos

      # The cache holds the xcframework; this only relinks Vendor/FFmpeg/FFmpeg.xcframework to it.
      - name: Link the FFmpeg xcframework
        run: TVBOX_FFMPEG_CACHE="$PWD/ffmpeg-cache" Scripts/build-apple-ffmpeg.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Install the signing certificate
        id: signing
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$IOS_CERTIFICATE" ] || [ -z "$IOS_PROVISIONING_PROFILE" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets; exporting an unsigned archive."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "profile=$UUID" >> "$GITHUB_OUTPUT"

      - name: Archive
        run: |
          SIGN=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=-)
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            SIGN=(CODE_SIGN_STYLE=Manual "PROVISIONING_PROFILE_SPECIFIER=${{ steps.signing.outputs.profile }}")
          fi
          xcodebuild archive -project TVBox.xcodeproj -scheme TVBox-iOS -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TVBox.xcarchive" -skipMacroValidation "${SIGN[@]}"

      # TrollStore installs an IPA whose .app carries no signature, which needs no certificate.
      - name: Pack an unsigned IPA
        if: steps.signing.outputs.signed != 'true'
        run: |
          APP="$RUNNER_TEMP/TVBox.xcarchive/Products/Applications"
          STAGE="$RUNNER_TEMP/ipa/Payload"
          mkdir -p "$STAGE"
          cp -R "$APP"/*.app "$STAGE/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr -9 TVBox-iOS-unsigned.ipa Payload)
          rm -rf "$STAGE"

      - name: Export the IPA
        if: steps.signing.outputs.signed == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.jo32.yingxia.ios</key><string>${{ steps.signing.outputs.profile }}</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TVBox.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      # Both signing branches reach the same publisher. It reads the archived version,
      # validates the exported IPA, renames it, and creates one release per workflow run.
      - name: Publish the iOS 16 Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          python3 Scripts/publish-ios-release.py \
            --archive "$RUNNER_TEMP/TVBox.xcarchive" \
            --ipa-directory "$RUNNER_TEMP/ipa" --signed "$IPA_SIGNED"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-iOS
          overwrite: true
          path: |
            ${{ runner.temp }}/ipa/*.ipa
            ${{ runner.temp }}/TVBox.xcarchive
          if-no-files-found: error
          retention-days: 14
